name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Pure JavaScript: the window's helpers and the uQ Settings page's logic and manifest.
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test 'tests/**/*.test.mjs'

  # Qt 6.5+ and libmpv 2, so it builds on Arch, its target distribution: the core tests, the
  # uQ page against the stub Settings module, then the real window playing a file under Xvfb
  # while playerctl checks what uQ's media widget sees over MPRIS.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt 6, mpv and the test tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-declarative \
            qt6-svg qt6-tools mpv xorg-server-xvfb xorg-xauth dbus playerctl ffmpeg \
            imagemagick ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (warnings are errors)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # uQ's kits (uq/native.toml) are exactly the pinned releases, and the problem codes match
      # uq/diag/reelo.toml
      - run: scripts/check-uq-native.sh
      - name: uQ Settings page
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq/tst_page.qml
      - name: The window plays a file and answers over MPRIS
        run: sh tests/gui/smoke.sh build shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-shots
          path: shots/
          if-no-files-found: ignore
